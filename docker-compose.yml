services:
  api:
    build:
      context: .
      dockerfile: src/backend/FundoTakeHome.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Data Source=/data/fundotakehome.db
      ExternalService__BaseUrl: http://mock:80/
    ports:
      - "8080:8080"
    volumes:
      - fundotakehome-data:/data
    networks:
      - fundotakehome

  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - fundotakehome

  mock:
    build:
      context: src/mock
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    networks:
      - fundotakehome

networks:
  fundotakehome:
    driver: bridge

volumes:
  fundotakehome-data:
